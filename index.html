    <style>
      /* Initial boot screen - shown while React loads */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080c12;
        z-index: 9999;
      }

      .boot-lines {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 2;
        color: #94a3b8;
        min-width: 300px;
      }

      /* No base opacity:0 — "both" fill keeps lines hidden during their delay,
         and if animations are disabled (battery saver etc.) text just shows. */
      .boot-lines .line {
        animation: boot-in 0.15s ease-out both;
      }
      .boot-lines .line:nth-child(1) { animation-delay: 0.05s; }
      .boot-lines .line:nth-child(2) { animation-delay: 0.3s; }
      .boot-lines .line:nth-child(3) { animation-delay: 0.55s; }

      .boot-lines .p { color: #38bdf8; }
      .boot-lines .ok { color: #2dd4bf; }

      .boot-cursor {
        display: inline-block;
        width: 8px;
        height: 14px;
        margin-left: 2px;
        vertical-align: middle;
        background: #38bdf8;
        animation: boot-blink 0.7s steps(1) infinite;
      }

      @keyframes boot-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-blink {
        50% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-lines .line { animation: none; }
        .boot-cursor { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="boot-lines" aria-hidden="true">
        <div class="line"><span class="p">&gt;</span> initializing haseeb_os v1.0 <span class="ok">✓</span></div>
        <div class="line"><span class="p">&gt;</span> loading modules: react · supabase · coffee <span class="ok">✓</span></div>
        <div class="line"><span class="p">&gt;</span> ready<span class="boot-cursor"></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove boot screen when React app loads. Waits for the boot lines to
      // finish (~0.7s) so the sequence reads as intentional, never longer.
      window.addEventListener('DOMContentLoaded', () => {
        const loader = document.getElementById('initial-loader');
        if (!loader) return;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(() => {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.3s ease';
          setTimeout(() => loader.remove(), 300);
        }, reduced ? 50 : 750);
      });
    </script>
  </body>
